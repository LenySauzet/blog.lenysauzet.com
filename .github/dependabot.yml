# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Dépendances Bun (package.json + bun.lock)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps):"
      prefix-development: 'chore(deps): '
      include: "scope"
    labels:
      - "dependencies"
    reviewers:
      - 'LenySauzet'
    # Chaque PR réécrit bun.lock, donc deux PR ouvertes en parallèle entrent en
    # conflit dès que la première est mergée. Le rebase automatique est ce qui
    # règle ça : ne pas le désactiver.
    groups:
      # Un seul lot pour tout ce qui ne franchit pas de majeure. Sans ça, une
      # exécution ouvre une dizaine de PR qui se marchent dessus.
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Publication cassée : la tarball npm de la 5.0.0 ne contient aucun code.
      - dependency-name: "remark-unwrap-images"
        versions: [">=5.0.0"]
      # Les types décrivent le runtime, pas le registre : ils suivent la majeure
      # de .nvmrc et engines.node, aujourd'hui 24. Des types en avance sur le
      # runtime valident du code qui plante à l'exécution, donc la majeure ne se
      # relève qu'après le plancher Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
