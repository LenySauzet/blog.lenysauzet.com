name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same major as local development. Vitest spawns Node, not
      # bun, so an unpinned runner silently tests against a different runtime
      # than anyone develops on: jsdom 30 passed here while failing locally on
      # 22.9 with ERR_REQUIRE_ESM. Keep in step with .nvmrc.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: node --version
      - run: bun install --frozen-lockfile
      - run: bun lint
      - run: bun run type-check
      - run: bun run test

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - run: bun install --frozen-lockfile
      # Reaches cdn.lenysauzet.com: components/Image resolves intrinsic
      # dimensions from image headers at build time, and fails the build rather
      # than guessing.
      - run: bun run build
